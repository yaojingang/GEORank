name: CLI CI

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "cli/**"
      - ".github/workflows/cli-ci.yml"
  push:
    branches:
      - main
      - master
      - "codex/**"
    paths:
      - "cli/**"
      - ".github/workflows/cli-ci.yml"

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: cli/pyproject.toml

      - name: Install CLI package
        run: pip install --disable-pip-version-check -e ./cli

      - name: Run CLI test suite
        run: python -m unittest discover -s cli/tests -v

      - name: Verify installed CLI entry point
        run: georank --version
